<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary mb-0">Listado de Mascotas</h2>
        <div>
            <a th:href="#" class="btn btn-info text-white me-2">Ver Reporte</a>
            <a th:href="#" class="btn btn-success">Registrar Mascota</a>
        </div>
    </div>

    <table class="table table-striped table-hover table-bordered">
        <thead class="table-dark">
            <th>ID</th>
            <th>Nombre</th>
            <th>Especie</th>
            <th>Raza</th>
            <th>Edad</th>
            <th>Sexo</th>
            <th>Tamaño</th>
            <th>Refugio</th>
            <th>Fecha de ingreso</th>
            <th>Acciones</th>
        </thead>

        <tbody>
        <tr th:each="pet : ${pets}">
            <td th:text="&{pet.petId}">
            <td th:text="&{pet.petName}">
            <td th:text="&{pet.breed}">
            <td th:text="&{}">
            <td th:text="&{}">
            <td th:text="&{}">

        </tr>


        </tbody>


    </table>


</body>
</html>
